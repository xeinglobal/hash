# MongoDB yapılandırma dosyası
# X-Ein projesi için güvenli yapılandırma

# Ağ ayarları
net:
  port: 27017
  bindIp: 127.0.0.1

# Güvenlik ayarları
security:
  authorization: enabled

# Depolama ayarları
storage:
  dbPath: /var/lib/mongodb
  journal:
    enabled: true

# Sistem log ayarları
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

# İşlem kontrolü
processManagement:
  timeZoneInfo: /usr/share/zoneinfo 